[build]
command = "pnpm build"
publish = "build"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_app/immutable/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
